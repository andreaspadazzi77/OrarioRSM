name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Test della logica di calcolo
        run: gradle :core:test --no-daemon

      - name: APK di prova (installabile sul telefono)
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepara la chiave di firma (se presente nei secrets)
        id: firma
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AAB firmato per Google Play
        if: steps.firma.outputs.ok == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OrarioRSM-apk-prova
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: steps.firma.outputs.ok == 'true'
        with:
          name: OrarioRSM-aab-play
          path: app/build/outputs/bundle/release/*.aab
